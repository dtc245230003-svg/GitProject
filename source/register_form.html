<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2: Form Đăng Ký Học Viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            padding: 20px;
        }

        .register-container {
            background: #ffffff;
            max-width: 550px;
            margin: 0 auto;
            padding: 25px 35px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
        }

        .btn-group {
            text-align: center;
            margin-top: 20px;
        }

        .btn-group input {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <h2>ĐĂNG KÝ HỌC VIÊN</h2>
        <form action="#" method="POST">

            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ tên" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group radio-group">
                <label>Giới tính:</label>
                <input type="radio" id="male" name="gender" value="Nam" checked>
                <label for="male">Nam</label>
                <input type="radio" id="female" name="gender" value="Nữ">
                <label for="female">Nữ</label>
                <input type="radio" id="other" name="gender" value="Khác">
                <label for="other">Khác</label>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ của bạn"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="HTML & CSS">HTML & CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <div class="form-group radio-group">
                <label>Hình thức học:</label>
                <input type="radio" id="online" name="study_type" value="Online" checked>
                <label for="online">Online</label>
                <input type="radio" id="offline" name="study_type" value="Offline">
                <label for="offline">Offline</label>
            </div>

            <div class="form-group checkbox-group">
                <label>Sở thích:</label>
                <input type="checkbox" id="sports" name="hobby" value="sports">
                <label for="sports">Thể thao</label>
                <input type="checkbox" id="music" name="hobby" value="music">
                <label for="music">Âm nhạc</label>
                <input type="checkbox" id="code" name="hobby" value="code">
                <label for="code">Lập trình</label>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm nếu có"></textarea>
            </div>

            <div class="btn-group">
                <input type="submit" class="btn-submit" value="Đăng ký">
                <input type="reset" class="btn-reset" value="Nhập lại">
            </div>

        </form>
    </div>

</body>

</html>
