<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1: Form Đơn Giản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        .form-container {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 10px;
            cursor: pointer;
        }

        .btn-group {
            margin-top: 20px;
        }

        .btn-group input {
            padding: 8px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Form Khảo Sát Thông Tin</h2>
        <form action="#" method="POST">

            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group checkbox-group">
                <label>Sở thích:</label> <br>
                <input type="checkbox" id="sports" name="hobby" value="sports">
                <label for="sports">Thể thao</label>

                <input type="checkbox" id="music" name="hobby" value="music">
                <label for="music">Âm nhạc</label>

                <input type="checkbox" id="reading" name="hobby" value="reading">
                <label for="reading">Đọc sách</label>
            </div>

            <div class="btn-group">
                <input type="submit" class="btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn-reset" value="Nhập lại">
            </div>

        </form>
    </div>

</body>

</html>
